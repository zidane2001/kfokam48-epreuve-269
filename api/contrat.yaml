openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

    put:
      summary: "Le relecteur corrige sa note tant que la session n'est pas clôturée (EF17, RG16). Issue #25 : DEUX relecteurs par exercice, la note exposée à l'auteur est la moyenne des rendues, provisoire si une seule (RG21/RG22)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200":
          description: Note corrigée ; l'affichage de l'étudiant suit la dernière version (décision §7 Q8/Q15)
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      description: |
        Évolution PO (CDC 7.14) : réservé au compte FORMATEUR quand AUTH_REQUIS=true
        (header Authorization: Bearer). Sans authentification (mode contrat), inchangé.
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (evolution PO)
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/suivi:
    get:
      summary: Vue riche du tableau de suivi (ajoutée pour le design, hors contrat imposé)
      description: |
        Enveloppe { lignes, totaux } : présence/source/statut exercice en périmètre
        mono-session, moyenne de promotion calculée serveur (F3), moyenne null si
        aucune note (7.9). Réservée au formateur en mode authentifié (evolution PO).
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sessionId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Tableau de suivi enrichi
          content:
            application/json:
              schema:
                type: object
                properties:
                  promotionId: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64, nullable: true }
                  lignes:
                    type: array
                    items:
                      type: object
                      properties:
                        etudiantId: { type: integer, format: int64 }
                        nomComplet: { type: string }
                        presentSession: { type: boolean, nullable: true }
                        sourcePresence: { type: string, nullable: true }
                        statutExercice: { type: string, nullable: true }
                        presences: { type: integer }
                        sessionsComptees: { type: integer }
                        exercicesDeposes: { type: integer }
                        notesRecues: { type: integer }
                        moyenne: { type: number, nullable: true }
                        relecturesEnAttente: { type: integer }
                  totaux:
                    type: object
                    properties:
                      etudiants: { type: integer }
                      presents: { type: integer, nullable: true }
                      sessionsComptees: { type: integer }
                      exercicesDeposes: { type: integer }
                      relecturesEnAttente: { type: integer }
                      moyennePromotion: { type: number, nullable: true }
        "400": { $ref: "#/components/responses/Erreur" }   # SESSION_HORS_PROMOTION
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE / SESSION_INCONNUE

  /api/auth/login:
    post:
      summary: Connexion par identifiants (evolution PO, CDC 7.14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, motDePasse]
              properties:
                login: { type: string }
                motDePasse: { type: string }
      responses:
        "200":
          description: Token JWT + identite
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [ETUDIANT, FORMATEUR] }
                  etudiantId: { type: integer, format: int64, nullable: true }
                  promotionId: { type: integer, format: int64, nullable: true }
                  login: { type: string }
        "401": { $ref: "#/components/responses/Erreur" }   # IDENTIFIANTS_INVALIDES

  /api/auth/me:
    get:
      summary: Identite courante depuis le token (evolution PO)
      responses:
        "200":
          description: Identite du compte connecte
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { type: string }
                  role: { type: string, enum: [ETUDIANT, FORMATEUR] }
                  etudiantId: { type: integer, format: int64, nullable: true }
                  promotionId: { type: integer, format: int64, nullable: true }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE

  /api/auth/mode:
    get:
      summary: Indique si l'authentification est active (evolution PO)
      responses:
        "200":
          description: Mode courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  authRequise: { type: boolean }

  /api/promotions:
    post:
      summary: Creer une promotion (evolution PO, CDC 7.15, formateur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom]
              properties:
                nom: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Promotion creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  nom: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # VALIDATION / CHAMP_MANQUANT
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE

  /api/etudiants:
    post:
      summary: Inscrit un etudiant et cree son compte (evolution PO, CDC 7.15, formateur uniquement)
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prenom, nom]
              properties:
                prenom: { type: string, maxLength: 80 }
                nom: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Etudiant inscrit, compte cree (login prenom.nom)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  prenom: { type: string }
                  nom: { type: string }
                  promotionId: { type: integer, format: int64 }
                  login: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # VALIDATION
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste les etudiants d'une promotion (evolution PO, formateur uniquement)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Etudiants de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    prenom: { type: string }
                    nom: { type: string }
                    promotionId: { type: integer, format: int64 }
                    login: { type: string }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/etudiants/{id}:
    delete:
      summary: Supprimer un etudiant sans participation (evolution PO, closes #30)
      description: |
        Formateur uniquement. Le compte de connexion est detruit avec l etudiant.
        409 ETUDIANT_A_DEJA_PARTICIPE si l etudiant a une presence, un exercice
        ou une relecture : l historique pedagogique est preserve.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Etudiant supprime }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_A_DEJA_PARTICIPE

  /api/promotions/{id}:
    delete:
      summary: Supprimer une promotion vide (evolution PO, closes #30)
      description: |
        Formateur uniquement. 409 PROMOTION_NON_VIDE si des etudiants existent
        encore, 409 PROMOTION_A_DEJA_SESSION si des sessions sont rattachees.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Promotion supprimee }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # PROMOTION_NON_VIDE / PROMOTION_A_DEJA_SESSION

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture la session (EF11)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée ; plus de correction de note (RG11), plus de dépôt
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/presences/formateur:
    post:
      summary: Le formateur ajoute une présence à la main (EF8, Q14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence créée avec source=FORMATEUR (RG10)
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice (EF10, Q13)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé (RG9)
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_COMMENCEE

  /api/etudiants/{id}/relectures-recues:
    get:
      summary: Notes et commentaires reçus par un étudiant, sans nom du relecteur (EF9, Q8)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des relectures reçues (relecteurId jamais exposé)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [exerciceId, note, commentaire]
                  properties:
                    exerciceId: { type: integer, format: int64 }
                    note: { type: integer, minimum: 0, maximum: 20 }
                    commentaire: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/relectures-a-faire:
    get:
      summary: Relectures assignées à un relecteur et non encore rendues (EF16/Q16)
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures en attente pour ce relecteur
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [relectureId, exerciceId, lien, depositaire]
                  properties:
                    relectureId: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lien: { type: string }
                    depositaire: { type: string }

  /api/promotions:
    get:
      summary: Liste des promotions (écran de sélection, Q1 choix du nom)
      responses:
        "200":
          description: Promotions et étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
