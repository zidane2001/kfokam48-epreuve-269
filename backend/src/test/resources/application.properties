# B6 : les tests tournent sur un poste vierge — H2 memoire, sans base locale ni Neon
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create

# Evolution PO : mode contrat du sujet pour les tests existants (aucune auth exigee).
# La suite AuthIntegrationTest force auth.requis=true via ses proprietes.
auth.requis=false
auth.secret=test-secret-minimum-32-caracteres-long!
