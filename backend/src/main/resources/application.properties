spring.application.name=backend

# --- Base de donnees : Neon via env (dev PO), fallback postgres local (correcteur) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/presence55}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- JPA : le schema appartient a Flyway (B5), Hibernate ne fait que valider ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

server.port=8080

# --- Resilience Neon : le pooler ferme les connexions idle (~5 min) ; on recycle
# les notres avant, sinon la premiere requete apres une pause tombe sur une
# connexion morte (veille du poste, longue inactivite) ---
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
