spring.application.name=backend

# --- Base de donnees : Neon via env (dev PO), fallback postgres local (correcteur) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/presence55}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- JPA : le schema appartient a Flyway (B5), Hibernate ne fait que valider ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

server.port=8080
